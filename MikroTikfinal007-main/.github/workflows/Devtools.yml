name: Flutter CI with DevTools

on:
  push:
    branches:
      - "Ali"   # يعمل فقط على فرع Ali
      - "main"
  pull_request:
    branches:
      - "**"   # يعمل على أي PR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      # تشغيل اختبارات Flutter مع profiling
      - name: Run Flutter Tests with Coverage
        run: |
          flutter test --coverage --reporter=json > test_results.json || echo "No tests found"

      # تحليل الكود
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # بناء APK للتحقق
      - name: Build Android APK (Debug)
        run: flutter build apk --debug

      # حفظ نتائج الاختبار كـ Artifact
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_results.json
            coverage/

      # إضافة ملخص
      - name: Add Summary
        if: always()
        run: |
          echo "# 🧪 Flutter CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code analyzed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests executed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build verified" >> $GITHUB_STEP_SUMMARY
