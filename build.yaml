# ============================================================
#  build_runner Configuration
#
#  يدعم:
#  - drift_dev: توليد كود قاعدة البيانات
#  - freezed: توليد copyWith / == / hashCode للـ State
#  - json_serializable: توليد fromJson/toJson
#  - riverpod_generator: توليد Providers من @riverpod annotations
# ============================================================

targets:
  $default:
    builders:
      drift_dev:
        options:
          store_date_time_values_as_text: true
          named_parameters: true
          fatal_warnings: true
          skip_verification_code: false

      freezed:
        options:
          explicit_to_json: true
          json: true
          union_key: type
          union_value_case: snake

      json_serializable:
        options:
          explicit_to_json: true
          any_map: true
          checked: true
          create_factory: true
          create_to_json: true

      riverpod_generator:
        options:
          # استخدام Riverpod v2 annotations
          provider_annotations:
            - riverpod
          # توليد select() تلقائي
          auto_dispose: true
