# ============================================================
#  Analysis Options — محسّن لمشاريع Flutter + Riverpod
#  القواعد:
#  - flutter_lints + rules إضافية للأداء والنظافة
#  - exclude لملفات الـ code generation
#  - riverpod_lint لقواعد Riverpod
# ============================================================

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
    missing_return: error
    dead_code: warning
  
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    # === الأداء ===
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_final_fields: true
    avoid_unnecessary_containers: true
    avoid_print: false  # مسموح لأن التطبيق يستخدم debugPrint

    # === النظافة ===
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    no_duplicate_case_values: true
    sort_child_properties_last: true
    use_full_hex_values_for_flutter_colors: true
    unawaited_futures: true  # يحذّر من Future بدون await

    # === null safety ===
    avoid_init_to_null: true
    unnecessary_null_checks: true
    unnecessary_null_comparison: true
    null_closures: true

    # === collections ===
    prefer_iterable_whereType: true
    use_if_null_to_convert_nulls_between_dart_and_json: false

    # === Riverpod-specific (requires riverpod_lint) ===
    # riverpod_avoid_using_ref: true
    # riverpod_provider_parameters: true
