name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

  build-web-release:
    name: Build Web Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Web release
        run: flutter build web --release --web-renderer canvaskit

      - name: Create Web archive
        run: |
          cd build/web
          tar -czf ../mikrotik-manager-web-${{ github.ref_name }}.tar.gz .

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.ref_name }}
          path: build/mikrotik-manager-web-${{ github.ref_name }}.tar.gz
          retention-days: 90

  build-windows-release:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create Windows archive
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/mikrotik-manager-windows-${{ github.ref_name }}.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: build/mikrotik-manager-windows-${{ github.ref_name }}.zip
          retention-days: 90

  build-linux-release:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build Linux release
        run: flutter build linux --release

      - name: Create Linux archive
        run: |
          cd build/linux/x64/release
          tar -czf ../../../mikrotik-manager-linux-${{ github.ref_name }}.tar.gz bundle/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ github.ref_name }}
          path: build/mikrotik-manager-linux-${{ github.ref_name }}.tar.gz
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android-release, build-web-release, build-windows-release, build-linux-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          # Android files
          cp release-artifacts/android-release-${{ github.ref_name }}/app-release.apk release-files/mikrotik-manager-${{ github.ref_name }}.apk
          cp release-artifacts/android-release-${{ github.ref_name }}/app-release.aab release-files/mikrotik-manager-${{ github.ref_name }}.aab
          
          # Other platform files
          cp release-artifacts/web-release-${{ github.ref_name }}/mikrotik-manager-web-${{ github.ref_name }}.tar.gz release-files/
          cp release-artifacts/windows-release-${{ github.ref_name }}/mikrotik-manager-windows-${{ github.ref_name }}.zip release-files/
          cp release-artifacts/linux-release-${{ github.ref_name }}/mikrotik-manager-linux-${{ github.ref_name }}.tar.gz release-files/

      - name: Generate release notes
        id: release-notes
        run: |
          cat > release-notes.md << 'EOF'
          # 🚀 Mikrotik Manager ${{ github.ref_name }}
          
          ## ✨ New Features
          - Updated app icon with Qahtani logo
          - Cross-platform support (Android, iOS, Web, Windows, Linux, macOS)
          - Modern Flutter 3.22 implementation
          
          ## 📱 Download Options
          
          ### Android
          - **APK**: Direct installation file for Android devices
          - **AAB**: Android App Bundle for Play Store distribution
          
          ### Desktop
          - **Windows**: Complete Windows application bundle
          - **Linux**: Linux application bundle (GTK3 required)
          
          ### Web
          - **Web Bundle**: Deploy to any web server or hosting service
          
          ## 🔧 Technical Details
          - Flutter Version: 3.22.3
          - Minimum Android Version: API 21 (Android 5.0)
          - Windows: Windows 10 or later
          - Linux: Ubuntu 18.04+ or equivalent with GTK3
          
          ## 🚀 Installation
          
          ### Android
          1. Download the APK file
          2. Enable "Install from unknown sources" in your device settings
          3. Install the APK
          
          ### Desktop
          1. Download the appropriate bundle for your platform
          2. Extract the archive
          3. Run the executable
          
          ### Web
          1. Download the web bundle
          2. Extract and deploy to your web server
          3. Access through your web browser
          
          ---
          
          Built with ❤️ using Flutter
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Mikrotik Manager ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release summary
        run: |
          echo "🎉 **Release Created Successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Release Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: Android (APK/AAB), Web, Windows, Linux" >> $GITHUB_STEP_SUMMARY
          echo "- Assets: $(ls release-files/ | wc -l) files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Release URL:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY