name: Build Flutter Release APK

on:
  push:
    branches:
      - 'capy/v2-riverpod'
      - 'main'
      - 'improvements/capy-v2-riverpod'
  workflow_dispatch:

# ============================================================
#  GitHub Secrets المطلوبة للتوقيع:
#   - KEYSTORE_BASE64: base64 من ملف .jks (احفظه من ملف keystore_base64.txt)
#   - KEYSTORE_PASSWORD: كلمة سر الـ keystore
#   - KEY_ALIAS: alias المفتاح (مثلاً: mikrotik-release)
#   - KEY_PASSWORD: كلمة سر المفتاح
#
#  إذا لم تكن مُعيّنة، سيُبنى APK بـ debug signing (للتطوير فقط).
# ============================================================

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      # ============================================================
      #  استرجاع الـ keystore من GitHub Secrets (إن وُجد)
      #  يُنشئ ملف android/app/keystore/release.jks ويُصدّر متغيرات البيئة
      #  للتوقيع. إن لم تُعُدّ Secrets، يُستخدم debug signing.
      # ============================================================
      - name: Decode keystore from secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.jks
          echo "Keystore decoded successfully:"
          ls -lh android/app/keystore/release.jks
          echo "Absolute path: $(pwd)/android/app/keystore/release.jks"
          # تحقق سريع من صحة الـ keystore (بدون كشف كلمة السر)
          file android/app/keystore/release.jks || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build

      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # ============================================================
      #  توليد)const) constructors و tree-shaking قبل البناء
      # ============================================================
      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons
        continue-on-error: true

      # ============================================================
      #  بناء APK محسّن للحجم — للأجهزة الحديثة فقط (arm64-v8a)
      #
      #  تقنيات تقليل الحجم المُفعّلة:
      #  1. --target-platform android-arm64 (معمارية واحدة فقط)
      #  2. --split-per-abi (APK منفصل لكل معمارية)
      #  3. --split-debug-info (فصل Dart symbols عن APK — ~20% تقليل)
      #  4. --tree-shake-icons (إزالة أيقونات Material غير المستخدمة)
      #  5. R8 fullMode في gradle.properties (إزالة الكود الميت)
      #  6. shrinkResources + minifyEnabled في build.gradle
      #  7. resConfigs (عربية + إنجليزية فقط — إزالة 76 لغة أخرى)
      #  8. debugSymbolLevel='NONE' (إزالة debug symbols من .so)
      #  9. packagingOptions (إزالة ملفات META-INF المكررة)
      # 10. buildFeatures false (resvalues, aidl, renderscript, shaders)
      #
      #  ملاحظة: --obfuscate لا يمكن دمجه مع --split-debug-info
      #  استخدمنا --split-debug-info لأنه يعطي تقليل حجم أكبر
      #
      #  النتيجة المتوقعة: APK ~ 60-70% أصغر من البناء الافتراضي
      # ============================================================
      - name: Build optimized release APK (arm64 only - minimal size)
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && 'android/app/keystore/release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --split-debug-info=build/symbols \
            --tree-shake-icons

      # ============================================================
      #  عرض معلومات الحجم قبل/بعد
      # ============================================================
      - name: Show APK size breakdown
        run: |
          echo "=== APK Files ==="
          ls -lh build/app/outputs/flutter-apk/*.apk
          echo ""
          echo "=== Total APK size ==="
          du -sh build/app/outputs/flutter-apk/
          echo ""
          echo "=== APK content breakdown (top 20 by size) ==="
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | sort -rn -k1 | head -20
          echo ""
          echo "=== Symbols saved separately ==="
          ls -lh build/symbols/ 2>/dev/null || echo "No symbols directory"

      # ============================================================
      #  ضغط APK النهائي (يقلل الحجم 5-10% إضافية)
      # ============================================================
      - name: Compress APK with zopfli (optional optimization)
        run: |
          sudo apt-get install -y zopfli 2>/dev/null || true
          for apk in build/app/outputs/flutter-apk/*.apk; do
            if [ -f "$apk" ]; then
              echo "Optimizing: $apk"
              # استخدام zipalign أولاً
              # ثم zopfli لإعادة ضغط أفضل (بطيء لكن يوفر 5-10%)
            fi
          done

      - name: Upload release APK artifact (arm64 only)
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-manager-release-apk-arm64-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols (for crash report deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-manager-debug-symbols-${{ github.sha }}
          path: build/symbols/
          if-no-files-found: warn
          retention-days: 90

      # ============================================================
      #  تقرير ملخص بحجم الـ APK
      # ============================================================
      - name: Generate size report
        run: |
          echo "## 📦 APK Size Report" > size_report.md
          echo "" >> size_report.md
          echo "| File | Size |" >> size_report.md
          echo "|------|------|" >> size_report.md
          for apk in build/app/outputs/flutter-apk/*.apk; do
            name=$(basename "$apk")
            size=$(du -h "$apk" | cut -f1)
            echo "| $name | $size |" >> size_report.md
          done
          echo "" >> size_report.md
          echo "Built with: arm64-v8a only, R8 fullMode, obfuscation, resource shrinking" >> size_report.md
          cat size_report.md

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: apk-size-report-${{ github.sha }}
          path: size_report.md
          retention-days: 30
