name: Build Flutter Release APK

on:
  push:
    branches:
      - main
      - master
      - 'improvements/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# ============================================================
#  GitHub Secrets for signing (optional):
#   - KEYSTORE_BASE64: base64 of the .jks file
#   - KEYSTORE_PASSWORD: keystore password
#   - KEY_ALIAS: key alias (e.g., mikrotik-release)
#   - KEY_PASSWORD: key password
#  If not set, APK will be built with debug signing.
# ============================================================

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      # ============================================================
      #  Decode keystore from secrets (if set)
      #  NOTE: env: block is evaluated BEFORE if: at step level,
      #  so env.KEYSTORE_BASE64 is visible in the if: condition.
      #  Bare 'secrets.X' (without != '') is NOT a valid boolean
      #  expression and causes the workflow to fail with 0 jobs.
      # ============================================================
      - name: Decode keystore from secrets
        id: decode-keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.jks
          echo "Keystore decoded successfully:"
          ls -lh android/app/keystore/release.jks
          echo "Absolute path: $(pwd)/android/app/keystore/release.jks"
          file android/app/keystore/release.jks || true
          echo "decoded=true" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      # ============================================================
      #  Build release APK (arm64 only — smaller size)
      # ============================================================
      - name: Build optimized release APK (arm64)
        env:
          KEYSTORE_PATH: ${{ steps.decode-keystore.outputs.decoded == 'true' && 'android/app/keystore/release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --tree-shake-icons

      - name: Show APK size breakdown
        run: |
          echo "=== APK Files ==="
          ls -lh build/app/outputs/flutter-apk/*.apk
          echo ""
          echo "=== Total APK size ==="
          du -sh build/app/outputs/flutter-apk/

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikrotik-manager-release-apk-arm64-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate size report
        run: |
          echo "## APK Size Report" > size_report.md
          echo "" >> size_report.md
          echo "| File | Size |" >> size_report.md
          echo "|------|------|" >> size_report.md
          for apk in build/app/outputs/flutter-apk/*.apk; do
            name=$(basename "$apk")
            size=$(du -h "$apk" | cut -f1)
            echo "| $name | $size |" >> size_report.md
          done
          echo "" >> size_report.md
          echo "Built with: arm64-v8a only, R8 minify, resource shrinking" >> size_report.md
          cat size_report.md

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: apk-size-report-${{ github.sha }}
          path: size_report.md
          retention-days: 30
