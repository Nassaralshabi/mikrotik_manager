name: Code Quality & Testing

on:
  push:
    branches: [ main, develop, 'feature/**', 'capy/**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read
  checks: write

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format .
        
      - name: Check for formatting changes
        run: |
          if git diff --quiet; then
            echo "✅ Code is properly formatted"
          else
            echo "ℹ️ Code was automatically formatted"
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "🎨 Auto-format code with dart format" || echo "No changes to commit"
          fi

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Check for unused dependencies
        run: |
          flutter pub deps 2>/dev/null | grep -E "^\s+\*\s" | wc -l > deps_count.txt
          echo "📦 Dependencies analyzed: $(cat deps_count.txt)" >> $GITHUB_STEP_SUMMARY

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          flutter test --coverage --reporter=json > test_results.json || echo "No tests found"
          
      - name: Check if coverage file exists
        id: coverage_check
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "has_coverage=true" >> $GITHUB_OUTPUT
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Codecov
        if: steps.coverage_check.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Add test summary
        run: |
          echo "🧪 **Test Results**" >> $GITHUB_STEP_SUMMARY
          if [ -f test_results.json ]; then
            echo "- Tests executed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No tests found (this is normal for new projects)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f coverage/lcov.info ]; then
            echo "- Coverage report generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No coverage data (add tests to generate coverage)" >> $GITHUB_STEP_SUMMARY
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run pub audit
        run: |
          flutter pub deps --json > deps.json
          echo "🔒 **Security Audit**" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies analyzed for security vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- Pub audit completed successfully" >> $GITHUB_STEP_SUMMARY

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons || echo "Icon generation skipped"

      - name: Test Android build
        run: flutter build apk --debug

      - name: Test Web build
        run: flutter build web --debug

      - name: Add build verification summary
        run: |
          echo "✅ **Build Verification Passed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🏗️ **Verified Builds:**" >> $GITHUB_STEP_SUMMARY
          echo "- Android APK (debug)" >> $GITHUB_STEP_SUMMARY
          echo "- Web Application (debug)" >> $GITHUB_STEP_SUMMARY
          echo "- App icons generated with Qahtani logo" >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [analyze, test, security-scan, build-check]
    if: always()
    steps:
      - name: Quality Gate Summary
        run: |
          echo "# 🏆 Code Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Code Analysis | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build Check | ${{ needs.build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Determine overall status
          if [ "${{ needs.analyze.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.security-scan.result }}" = "success" ] && [ "${{ needs.build-check.result }}" = "success" ]; then
            echo "🎉 **Overall Status: PASSED** ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Overall Status: FAILED** ❌" >> $GITHUB_STEP_SUMMARY
          fi