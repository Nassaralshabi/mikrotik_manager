// ============================================================
//  build.gradle (Groovy) — محسّن لأصغر حجم APK ممكن
//  كل تقنيات تقليل الحجم مُفعّلة
// ============================================================

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// ============================================================
//  Signing config — يقرأ key.properties المحلي أو بيئة الـ CI
//  الأولوية:
//   1) متغيرات بيئة CI (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
//   2) ملف android/key.properties محلياً
//   3) fallback إلى signingConfigs.debug
// ============================================================
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def isCiSigning = System.env.KEYSTORE_PATH != null && !System.env.KEYSTORE_PATH.isEmpty()
def hasKeyProperties = keystoreProperties.getProperty('storeFile') != null

android {
    namespace "com.example.mikrotik_manager"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // إزالة kotlin reflect و kotlin coroutines debug
        freeCompilerArgs += ['-Xno-param-assertions', '-Xno-call-assertions']
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.mikrotik_manager"
        minSdk 21
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // ===== لا نضع abiFilters في defaultConfig عند استخدام splits =====
        // splits.abi سيتكفّل بالفصل
        vectorDrawables {
            useSupportLibrary = true
        }

        // تجاهل حزم اللغات غير المستخدمة (Fluter يدعم 78 لغة افتراضياً)
        // نُبقي العربية والإنجليزية فقط
        resConfigs 'ar', 'en'
    }

    // ===== تفعيل buildConfig (مطلوب لـ buildConfigField) =====
    buildFeatures {
        buildConfig true
    }

    // ===== لا نستخدم splits.abi هنا =====
    // Flutter يضيف abiFilters افتراضياً التي تتعارض مع splits.abi
    // بدلاً من ذلك نستخدم --target-platform + --split-per-abi في flutter build
    // هذا يعطي نفس النتيجة (APK منفصل لكل معمارية) بدون تعارض

    // ============================================================
    //  Signing Configs — release keystore من CI env أو key.properties
    // ============================================================
    signingConfigs {
        release {
            if (isCiSigning) {
                // في CI: KEYSTORE_PATH نسبي لجذر الـ repo (مثل: android/app/keystore/release.jks)
                // rootProject.projectDir = .../android/ ، فنأخذ parentFile لجذر الـ repo
                def repoRoot = rootProject.projectDir.parentFile
                storeFile new File(repoRoot, System.env.KEYSTORE_PATH)
                storePassword System.env.KEYSTORE_PASSWORD
                keyAlias System.env.KEY_ALIAS
                keyPassword System.env.KEY_PASSWORD
            } else if (hasKeyProperties) {
                // محلياً: storeFile نسبي لمجلد android/app/ (موقع build.gradle)
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
            // وإلا fallback إلى signingConfigs.debug (يُحدّد لاحقاً)
        }
    }

    buildTypes {
        release {
            // استخدم signing release إن وُجد، وإلا debug (للتطوير)
            if (isCiSigning || hasKeyProperties) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }

            // ===== R8 / ProGuard — أهم خطوة لتقليل الحجم =====
            minifyEnabled true       // إزالة الكود الميت (~30% تقليل)
            shrinkResources true     // إزالة الموارد غير المستخدمة (~10% تقليل)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // خصائص الـ Build للإصدار
            buildConfigField "Boolean", "DEBUG_MODE", "false"

            // إزالة debug symbols من المكتبات الأصلية
            // يقلل حجم libapp.so و libflutter.so بشكل كبير
            // (الـ symbols تُحفظ في build/symbols بدل APK)
        }

        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField "Boolean", "DEBUG_MODE", "true"
        }

        profile {
            minifyEnabled false
            shrinkResources false
            buildConfigField "Boolean", "DEBUG_MODE", "false"
        }
    }

    // ===== إزالة الملفات غير الضرورية من APK =====
    packagingOptions {
        // ملفات META-INF مكررة بين المكتبات
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/versions/**'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude 'META-INF/io.netty.versions.properties'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/MANIFEST.MF'

        // ملفات ProGuard المُدمجة من المكتبات
        exclude 'META-INF/proguard/**'

        // ملفات ترخيص Mentor Graphics (من PDF libraries)
        exclude 'META-INF/maven/**'
        exclude 'about_files/**'
        exclude 'about.html'
        exclude 'plugin.properties'
        exclude 'OSGI-INF/**'

        // ضغط الموارد غير المضغوطة (يقلل الحجم)
        jniLibs {
            useLegacyPackaging false  // يستخرج .so من APK (أصغر)
        }
    }
}

flutter {
    source '../..'
    // تمرير --split-debug-info لفصل debug symbols عن APK
    // يقلل حجم APK بشكل كبير جداً (~20-40%)
    // لكنه يتطلب تخزين الـ symbols لإعادة الـ stack traces
}

dependencies {}
