name: num_router_manager
description: >-
  لوحة تحكم Flutter لإدارة مشتركين MikroTik وتحويل سكربت NUM القديم إلى تطبيق حديث.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  google_fonts: ^6.2.1
  provider: ^6.1.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - reference_backend/cards/img/
    - reference_backend/reports/
